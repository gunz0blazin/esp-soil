# ESP-Soil server deploy, run on the Pi by ansible-pull (see deploy/README.md).
#
# What it does, in order:
#   1. checks the secrets in /etc/esp-soil exist
#   2. validates the new Prometheus config and compose file BEFORE touching anything live
#   3. syncs dashboard/ from the repo checkout into /opt/esp-soil/dashboard
#   4. docker compose up, restarting Prometheus/Grafana only if their config changed
#   5. waits until both are healthy and counts how many stakes are UP
#   6. sends a notification (optional) when something changed, or when it fails
#
# The timer runs this every 5 minutes whether or not the branch has new commits.
# It's idempotent: with nothing new it changes nothing, restarts nothing and stays
# quiet, and a deploy that failed is simply tried again on the next run.
#
# It never touches the stakes. Firmware is flashed from the ESPHome add-on.

- name: Deploy ESP-Soil monitoring stack
  hosts: localhost
  connection: local
  # Runs as root already (systemd timer, bootstrap, `sudo esp-soil-deploy`), so no
  # privilege escalation: that would need sudo installed, which minimal installs lack.
  gather_facts: false

  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    secrets_dir: /etc/esp-soil
    deploy_dir: /opt/esp-soil/dashboard
    compose_project: esp-soil
    prometheus_url: http://127.0.0.1:9090
    grafana_url: http://127.0.0.1:3000
    # When false (CI), skip installing the wrapper/systemd units onto the machine.
    manage_host: true
    # Commit of the last failed deploy, so a failure is notified once, not every 5 minutes.
    failed_marker: /var/lib/esp-soil/last_failed_commit
    # Commit of the last successful deploy, so every new commit gets a notification.
    deployed_marker: /var/lib/esp-soil/deployed_commit

  tasks:
    - name: Deploy
      block:
        - name: Check this is running as root
          ansible.builtin.command: id -u
          register: uid
          changed_when: false

        - name: Stop if not root
          ansible.builtin.assert:
            that: uid.stdout == "0"
            fail_msg: The deploy writes to /opt and /etc, so run it as root (sudo esp-soil-deploy).
            quiet: true

        - name: Read the commit being deployed
          # safe.directory: the checkout may belong to another user (e.g. in CI)
          ansible.builtin.command: git -c safe.directory=* -C {{ repo_dir }} log -1 --format=%h%x20%s
          register: commit
          changed_when: false

        - name: Check required secrets exist
          ansible.builtin.stat:
            path: "{{ secrets_dir }}/{{ item }}"
          loop: [esp_web_password, grafana_admin_password]
          register: secret_files

        - name: Stop if a secret is missing
          ansible.builtin.assert:
            that: item.stat.exists and item.stat.isreg
            fail_msg: >-
              {{ secrets_dir }}/{{ item.item }} is missing or not a file.
              See deploy/README.md, "Secrets on the Pi".
            quiet: true
          loop: "{{ secret_files.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Read secrets
          ansible.builtin.slurp:
            src: "{{ secrets_dir }}/{{ item }}"
          loop: [esp_web_password, grafana_admin_password]
          register: secret_values
          no_log: true

        - name: Find the pinned Prometheus image
          ansible.builtin.set_fact:
            prometheus_image: >-
              {{ lookup('ansible.builtin.file', repo_dir ~ '/dashboard/docker-compose.yml')
                 | regex_search('prom/prometheus:\S+') }}

        # A box can have its own list of stakes in /etc/esp-soil/targets/ (a test box
        # with a probe at home, set up by the bootstrap). If it has any, Prometheus
        # reads that folder instead of the repo's list. Production leaves it empty.
        - name: Look for a box-local list of stakes
          ansible.builtin.find:
            paths: "{{ secrets_dir }}/targets"
            patterns: "*.yml"
          register: local_targets

        - name: Choose the list of stakes
          ansible.builtin.set_fact:
            targets_dir: >-
              {{ (secrets_dir ~ '/targets') if local_targets.matched > 0
                 else (deploy_dir ~ '/prometheus/targets') }}
            targets_source: >-
              {{ ('this box (' ~ secrets_dir ~ '/targets)') if local_targets.matched > 0
                 else 'the repo (dashboard/prometheus/targets)' }}

        - name: Report which list of stakes is used
          ansible.builtin.debug:
            msg: "Stakes come from {{ targets_source }}"

        # ---- validate the new config before anything live changes ----
        - name: Validate Prometheus config (promtool)
          ansible.builtin.command: >-
            docker run --rm --entrypoint promtool
            -v {{ repo_dir }}/dashboard/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            -v {{ (secrets_dir ~ '/targets') if local_targets.matched > 0 else (repo_dir ~ '/dashboard/prometheus/targets') }}:/etc/prometheus/targets:ro
            -v {{ secrets_dir }}/esp_web_password:/etc/prometheus/esp_web_password:ro
            {{ prometheus_image }} check config /etc/prometheus/prometheus.yml
          changed_when: false

        - name: Validate compose file
          ansible.builtin.command: docker compose -f {{ repo_dir }}/dashboard/docker-compose.yml config --quiet
          environment:
            GRAFANA_ADMIN_PASSWORD: validate-only
          changed_when: false

        # ---- apply ----
        - name: Create deploy folders
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop: ["{{ deploy_dir }}", "{{ failed_marker | dirname }}"]

        - name: Sync dashboard/ into the deploy folder
          ansible.builtin.command: >-
            rsync -a --omit-dir-times --delete --itemize-changes
            --exclude /.env --exclude /prometheus/esp_web_password
            {{ repo_dir }}/dashboard/ {{ deploy_dir }}/
          register: sync
          changed_when: sync.stdout | trim | length > 0

        - name: Install the board password for Prometheus
          ansible.builtin.copy:
            content: "{{ (secret_values.results[0].content | b64decode).rstrip('\r\n') }}"
            dest: "{{ deploy_dir }}/prometheus/esp_web_password"
            mode: "0644"   # Prometheus runs as "nobody" inside the container
          register: web_pw
          no_log: true

        - name: Write compose .env
          ansible.builtin.copy:
            content: |
              GRAFANA_ADMIN_PASSWORD={{ (secret_values.results[1].content | b64decode).rstrip('\r\n') }}
              TARGETS_DIR={{ targets_dir }}
            dest: "{{ deploy_dir }}/.env"
            mode: "0600"
          register: env_file
          no_log: true

        - name: Start or update the stack
          ansible.builtin.command: >-
            docker compose --progress plain -p {{ compose_project }} -f {{ deploy_dir }}/docker-compose.yml
            up -d --remove-orphans
          register: up
          changed_when: up.stderr is search('Created|Recreated|Started|Pulled')

        # Bind-mounted config files don't restart a container on their own.
        # Targets are re-read automatically, so they're not in this list.
        - name: Restart Prometheus if its config or password changed
          ansible.builtin.command: docker compose --progress plain -p {{ compose_project }} -f {{ deploy_dir }}/docker-compose.yml restart prometheus
          when: >-
            web_pw is changed or
            (sync.stdout_lines | select('search', ' prometheus/prometheus\.yml$') | list | length > 0)

        - name: Restart Grafana if provisioning changed
          ansible.builtin.command: docker compose --progress plain -p {{ compose_project }} -f {{ deploy_dir }}/docker-compose.yml restart grafana
          when: sync.stdout_lines | select('search', ' grafana/provisioning/') | list | length > 0

        # ---- health ----
        - name: Wait for Prometheus
          ansible.builtin.uri:
            url: "{{ prometheus_url }}/-/ready"
          register: prom_ready
          until: prom_ready.status == 200
          retries: 30
          delay: 4

        - name: Wait for Grafana
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/health"
          register: graf_ready
          until: graf_ready.status == 200
          retries: 30
          delay: 4

        # Give Prometheus up to a minute to load targets/ and scrape each stake
        # once, so the count below is real rather than 0 right after a restart.
        - name: Count stakes Prometheus can reach
          ansible.builtin.uri:
            url: "{{ prometheus_url }}/api/v1/targets?state=active"
            return_content: true
          register: targets
          until: >-
            targets.json.data.activeTargets | length > 0 and
            targets.json.data.activeTargets | selectattr('health', 'equalto', 'unknown') | list | length == 0
          retries: 15
          delay: 4
          ignore_errors: true   # an empty or slow target list shouldn't fail the deploy

        - name: Stop if Prometheus didn't answer at all
          ansible.builtin.assert:
            that: targets.json is defined
            fail_msg: Prometheus is up but its targets API didn't respond.
            quiet: true

        # Down = no good reading in the last minute. One missed scrape (an ESP32's web
        # server is slow and can time out now and then) doesn't count.
        - name: Find stakes with no good reading in the last minute
          ansible.builtin.uri:
            url: "{{ prometheus_url }}/api/v1/query?query={{ 'max_over_time(up{job=\"esphome\"}[1m]) == 0' | urlencode }}"
            return_content: true
          register: down_query
          ignore_errors: true

        - name: Summarize
          ansible.builtin.set_fact:
            stakes_total: "{{ targets.json.data.activeTargets | length }}"
            stakes_down: >-
              {{ (down_query.json.data.result | map(attribute='metric.board') | list | sort)
                 if (down_query.json is defined)
                 else (targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up')
                       | map(attribute='labels.board') | list) }}

        - name: Count stakes up
          ansible.builtin.set_fact:
            stakes_up: "{{ (stakes_total | int) - (stakes_down | length) }}"

        - name: Report
          ansible.builtin.debug:
            msg: "Deployed {{ commit.stdout }}. Stakes up: {{ stakes_up }}/{{ stakes_total }} {{ stakes_down if stakes_down | length else '' }}"

        # ---- keep the pipeline itself up to date ----
        - name: Install deploy command and systemd units
          ansible.builtin.copy:
            src: "{{ repo_dir }}/deploy/{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - {src: esp-soil-deploy, dest: /usr/local/bin/esp-soil-deploy, mode: "0755"}
            - {src: systemd/esp-soil-deploy.service, dest: /etc/systemd/system/esp-soil-deploy.service, mode: "0644"}
            - {src: systemd/esp-soil-deploy.timer, dest: /etc/systemd/system/esp-soil-deploy.timer, mode: "0644"}
          register: units
          when: manage_host | bool

        - name: Reload systemd
          ansible.builtin.systemd:
            daemon_reload: true
          when: manage_host | bool and units is changed

        - name: Check whether the last deploy had failed
          ansible.builtin.stat:
            path: "{{ failed_marker }}"
          register: had_failed

        - name: Clear the failed-deploy marker
          ansible.builtin.file:
            path: "{{ failed_marker }}"
            state: absent

        - name: Remember the deployed commit
          ansible.builtin.copy:
            content: "{{ commit.stdout }}"
            dest: "{{ deployed_marker }}"
            mode: "0644"
          register: new_commit

        - name: Did this run change anything?
          ansible.builtin.set_fact:
            deploy_changed: >-
              {{ sync is changed or web_pw is changed or env_file is changed or up is changed
                 or units is changed or new_commit is changed }}

        - name: Report changes
          ansible.builtin.debug:
            msg: >-
              {{ 'New commit or changes applied.' if deploy_changed | bool else 'Nothing new: already up to date, nothing restarted.' }}

        # Quiet when nothing changed, so the 5-minute runs don't spam the phone.
        - name: Notify success
          when: deploy_changed | bool or had_failed.stat.exists
          ansible.builtin.include_tasks: notify.yml
          vars:
            notify_title: "{{ 'ESP-Soil deployed' if deploy_changed | bool else 'ESP-Soil deploy working again' }}"
            notify_tags: white_check_mark
            notify_priority: default
            notify_body: "{{ commit.stdout }}\nStakes up: {{ stakes_up }}/{{ stakes_total }}{{ ('\nDown: ' ~ (stakes_down | join(', '))) if stakes_down | length else '' }}"

      rescue:
        - name: Read the last failed commit
          ansible.builtin.slurp:
            src: "{{ failed_marker }}"
          register: last_failed
          failed_when: false

        - name: Remember this failure
          ansible.builtin.copy:
            content: "{{ commit.stdout | default('unknown') }}"
            dest: "{{ failed_marker }}"
            mode: "0644"
          failed_when: false

        # Once per failing commit; the next runs retry quietly until it works.
        - name: Notify failure
          when: (last_failed.content | default('') | b64decode) != (commit.stdout | default('unknown'))
          ansible.builtin.include_tasks: notify.yml
          vars:
            notify_title: "ESP-Soil deploy FAILED"
            notify_tags: x
            notify_priority: high
            notify_body: >-
              {{ commit.stdout | default('unknown commit') }}
              failed at: {{ ansible_failed_task.name | default('?') }}.
              Run 'journalctl -u esp-soil-deploy' on the Pi for details.

        - name: Fail the run
          ansible.builtin.fail:
            msg: "Deploy failed at: {{ ansible_failed_task.name | default('?') }}"

# ESP-Soil stake v1 — one board per pot
# XIAO ESP32-C3 + SEN0193 probe (hard-wired) + AHT10, no screen. View data in Grafana.
#
# Board pinout
#   D1 / GPIO3  <- probe signal, through divider R1 10k / R2 33k (keeps it under the C3's ~2.5 V ADC limit)
#   D4 / GPIO6  -> AHT10 SDA
#   D5 / GPIO7  -> AHT10 SCL
#   3V3 / GND   -> AHT10 + probe power
#
# For each stake, change the substitutions below (plant number + its own calibration), then flash.
# Calibrate: watch "Plant N raw" (volts at the ESP pin, after the divider)
#   dry_v = probe in air / dry mix,  wet_v = 30 min after a full watering. Dry reads HIGHER than wet.

substitutions:
  plant: "1"
  node_name: soil-stake-1
  dry_v: "1.92"     # ~2.5 V probe output x 0.767 divider — replace with your reading
  wet_v: "0.92"     # ~1.2 V probe output x 0.767 divider — replace with your reading
  leaf_offset_c: "2.0"

esphome:
  name: ${node_name}
  friendly_name: Soil Stake ${plant}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

# Grafana/Prometheus reads http://<stake-ip>/metrics
# Login protects the web page AND /metrics. Prometheus logs in with the same
# user/password (see dashboard/prometheus/prometheus.yml).
# type: basic is required: Prometheus can't do digest, and ESPHome's default
# switches to digest in 2027.1.
web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
    type: basic

prometheus:

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  # ---------- soil probe ----------
  - platform: adc
    pin: GPIO3
    name: "Plant ${plant} raw"
    id: probe_raw
    attenuation: 12db
    accuracy_decimals: 3
    update_interval: 5s
    filters:
      - median:
          window_size: 7
          send_every: 2
    on_value:
      then:
        - lambda: |-
            float pct = (${dry_v} - x) / (${dry_v} - ${wet_v}) * 100.0f;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(moisture).publish_state(pct);

  - platform: template
    name: "Plant ${plant} moisture"
    id: moisture
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    icon: "mdi:water-percent"
    update_interval: never

  # ---------- climate ----------
  - platform: aht10
    variant: AHT10
    update_interval: 15s
    temperature:
      name: "Plant ${plant} temperature"
      id: temp_c
      # filters:
      #   - offset: -1.0   # the ESP warms the board slightly; correct vs a trusted thermometer
    humidity:
      name: "Plant ${plant} humidity"
      id: rh

  - platform: template
    name: "Plant ${plant} leaf VPD"
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (!id(temp_c).has_state() || !id(rh).has_state()) return NAN;
      float t = id(temp_c).state, tl = t - ${leaf_offset_c};
      float svp_air  = 0.6108f * expf(17.27f * t  / (t  + 237.3f));
      float svp_leaf = 0.6108f * expf(17.27f * tl / (tl + 237.3f));
      return svp_leaf - svp_air * id(rh).state / 100.0f;

  - platform: wifi_signal
    name: "Plant ${plant} WiFi"
    update_interval: 60s

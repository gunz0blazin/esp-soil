# Test board: 1 soil probe + AHT10 + OLED, one screen, no buttons
#
# Wiring (everything VCC -> 3V3, GND -> GND)
#   Probe (SEN0193):  blue -> GPIO32
#   OLED (SSD1306):   SDA -> GPIO21, SCL -> GPIO22   (I2C bus A)
#   AHT10:            SDA -> GPIO25, SCL -> GPIO26   (I2C bus B, on its own)
#
# Screen (2x2 grid, updates every 2 s):
#   MOIST %  |  TEMP F
#   -----------------
#   RH %     |  VPD kPa (leaf)
#
# Calibrate the probe: watch "Probe raw" in Home Assistant or the logs
#   - dry (air / dry mix)            -> dry_v
#   - wet (30 min after full water)  -> wet_v
#   Dry reads a HIGHER voltage than wet.

substitutions:
  dry_v: "2.50"
  wet_v: "1.20"
  # Leaves under LEDs usually run ~1-3 C cooler than the air. Used for leaf VPD.
  leaf_offset_c: "2.0"

esphome:
  name: moisture-test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

# Serves http://<board-ip>/metrics for Prometheus/Grafana
web_server:
  port: 80

prometheus:

i2c:
  - id: bus_a          # OLED
    sda: GPIO21
    scl: GPIO22
  - id: bus_b          # AHT10 only
    sda: GPIO25
    scl: GPIO26

sensor:
  # ---------- soil probe ----------
  - platform: adc
    pin: GPIO32
    name: "Probe raw"
    id: probe_raw
    attenuation: 12db
    accuracy_decimals: 3
    update_interval: 2s
    filters:
      - median:
          window_size: 5
          send_every: 1
    on_value:
      then:
        - lambda: |-
            // volts -> %: dry_v = 0%, wet_v = 100%
            float pct = (${dry_v} - x) / (${dry_v} - ${wet_v}) * 100.0f;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(probe_pct).publish_state(pct);

  - platform: template
    name: "Soil moisture"
    id: probe_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    icon: "mdi:water-percent"
    update_interval: never   # updated by the raw sensor above

  # ---------- climate (AHT10 on bus B) ----------
  - platform: aht10
    i2c_id: bus_b
    variant: AHT10
    update_interval: 15s
    temperature:
      name: "Tent temperature"
      id: tent_temp
      # filters:
      #   - offset: 0.0    # correct after comparing to a trusted thermometer
    humidity:
      name: "Tent humidity"
      id: tent_rh
      # filters:
      #   - offset: 0.0

  # Air VPD (kPa)
  - platform: template
    name: "Air VPD"
    id: vpd_air
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (!id(tent_temp).has_state() || !id(tent_rh).has_state()) return NAN;
      float t = id(tent_temp).state;
      float rh = id(tent_rh).state;
      float svp = 0.6108f * expf(17.27f * t / (t + 237.3f));
      return svp * (1.0f - rh / 100.0f);

  # Leaf VPD (kPa): leaf assumed cooler than air by leaf_offset_c
  - platform: template
    name: "Leaf VPD"
    id: vpd_leaf
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (!id(tent_temp).has_state() || !id(tent_rh).has_state()) return NAN;
      float t = id(tent_temp).state;
      float tl = t - ${leaf_offset_c};
      float rh = id(tent_rh).state;
      float svp_air  = 0.6108f * expf(17.27f * t  / (t  + 237.3f));
      float svp_leaf = 0.6108f * expf(17.27f * tl / (tl + 237.3f));
      return svp_leaf - svp_air * rh / 100.0f;

font:
  - file: "gfonts://Roboto"
    id: f_small
    size: 10
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 18

display:
  - platform: ssd1306_i2c
    i2c_id: bus_a
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      // 2x2 grid
      it.line(64, 0, 64, 63);
      it.line(0, 32, 127, 32);

      // label top-left of each box, value centered lower in the box
      auto box = [&](int x, int y, const char *label, bool ok, const char *fmt, float v) {
        it.print(x + 2, y + 1, id(f_small), label);
        if (ok) it.printf(x + 32, y + 20, id(f_big), TextAlign::CENTER, fmt, v);
        else    it.print (x + 32, y + 20, id(f_big), TextAlign::CENTER, "--");
      };

      bool m_ok = id(probe_pct).has_state();
      bool t_ok = id(tent_temp).has_state() && !isnan(id(tent_temp).state);
      bool h_ok = id(tent_rh).has_state() && !isnan(id(tent_rh).state);
      bool v_ok = id(vpd_leaf).has_state() && !isnan(id(vpd_leaf).state);

      box(0,  0,  "MOIST", m_ok, "%.0f%%", id(probe_pct).state);
      box(64, 0,  "TEMP",  t_ok, "%.1fF",  id(tent_temp).state * 9.0f / 5.0f + 32.0f);
      box(0,  32, "RH",    h_ok, "%.0f%%", id(tent_rh).state);
      box(64, 32, "VPD",   v_ok, "%.2f",   id(vpd_leaf).state);

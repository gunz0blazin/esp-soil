# Stake config for the ESPHome add-on in Home Assistant.
#
# Copy this into the add-on (one file per stake, e.g. soil-stake-1.yaml), set the
# values for that stake, and Install. The shared firmware comes straight from
# the main branch on GitHub every time you build, so the add-on always flashes
# exactly what's been merged. Your passwords stay in the add-on's secrets.yaml.

substitutions:
  plant: "1"
  node_name: soil-stake-1
  stake_ip: 10.42.0.11      # fixed IP for this stake (DHCP reservation)
  dry_v: "1.92"             # this probe's dry reading
  wet_v: "0.92"             # this probe's wet reading

  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  web_username: !secret web_username
  web_password: !secret web_password
  api_key: !secret api_key

packages:
  stake:
    url: https://github.com/gunz0blazin/esp-soil
    ref: main                 # only merged code gets flashed
    files: [firmware/common.yaml]
    refresh: 0s               # fetch the latest main on every build

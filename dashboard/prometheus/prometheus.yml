global:
  scrape_interval: 15s

scrape_configs:
  - job_name: esphome
    metrics_path: /metrics
    # Stakes are flashed with a web_server login (web_username / web_password in
    # the ESPHome secrets.yaml). Prometheus sends it on every scrape. Boards
    # without a login just ignore it, so old and new firmware can share this job.
    # The password lives in esp_web_password next to this file (gitignored),
    # mounted into the container by docker-compose.yml.
    basic_auth:
      username: esp
      password_file: /etc/prometheus/esp_web_password
    # The list of stakes lives in targets/*.yml. Prometheus re-reads those files
    # on its own, so adding or removing a stake doesn't need a restart.
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 1m

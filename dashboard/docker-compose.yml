# ESP-Soil logging: Prometheus (stores data) + Grafana (graphs)
#
# Before the first start, next to this file:
#   prometheus/esp_web_password   the stakes' web_password (no trailing newline)
#   .env                          GRAFANA_ADMIN_PASSWORD=...
# On the Pi, deploy/ (ansible-pull) creates both from /etc/esp-soil/.
#
# Start:   docker compose up -d
# Grafana: http://<this-server-ip>:3000  (user admin)
#
# Image versions are pinned so an update only happens when this file changes.
# CI checks that both tags exist and have ARM64 builds for the Raspberry Pi.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: esp-soil-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2y      # keep 2 years of history
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/esp_web_password:/etc/prometheus/esp_web_password:ro   # stake login
      - ./prometheus/targets:/etc/prometheus/targets:ro                       # list of stakes
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:13.2.3
    container_name: esp-soil-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Only used the first time Grafana starts with an empty grafana-data volume.
      # After that, change it in Grafana (Profile → Change password).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/soil-monitor.json
      # Lets the Home Assistant "Webpage" dashboard embed Grafana:
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  prometheus-data:
  grafana-data:

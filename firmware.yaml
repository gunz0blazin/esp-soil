# Grow tent soil moisture monitor

web_server:
  port: 80

prometheus:
  
substitutions:
  dry_v: "2.50"
  wet_v: "1.20"

esphome:
  name: moisture-test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# Wi-Fi is optional for this test. Delete these blocks (and secrets.yaml)
# if you just want to flash over USB and watch the screen.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  encryption:
    key: !secret moisture_test__encryption_key
ota:
  - platform: esphome

sensor:
  - platform: adc
    pin: GPIO32
    name: "RAW V"
    id: probe_raw
    attenuation: 12db
    update_interval: 2s
    filters:
      - median:
          window_size: 5
          send_every: 1
    on_value:
      then:
        - lambda: |-
            // volts -> %: dry_v = 0%, wet_v = 100%
            float pct = (${dry_v} - x) / (${dry_v} - ${wet_v}) * 100.0f;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(probe_pct).publish_state(pct);
            ESP_LOGI("probe", "RAW: %.3f V   MOISTURE: %.0f %%", x, pct);

  - platform: template
    name: "Soil Moisture"
    id: probe_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    icon: "mdi:water-percent"
    update_interval: never   # updated by the raw sensor above

i2c:
  sda: GPIO21
  scl: GPIO22

font:
  - file: "gfonts://Roboto"
    id: f_small
    size: 10
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 24

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3c
    update_interval: 1s
    lambda: |-
      // Screen split in half: top = moisture %, bottom = raw volts
      it.line(0, 32, 127, 32);
      it.print(0, 0, id(f_small), "MOIST");
      it.print(0, 34, id(f_small), "RAW");

      if (id(probe_pct).has_state())
        it.printf(127, 16, id(f_big), TextAlign::CENTER_RIGHT, "%.0f%%", id(probe_pct).state);
      else
        it.print(127, 16, id(f_big), TextAlign::CENTER_RIGHT, "--");

      if (id(probe_raw).has_state())
        it.printf(127, 48, id(f_big), TextAlign::CENTER_RIGHT, "%.3fV", id(probe_raw).state);
      else
        it.print(127, 48, id(f_big), TextAlign::CENTER_RIGHT, "--");

# Copy to secrets.yaml next to the stake files and fill in. secrets.yaml is gitignored.
#   Home Assistant add-on: /config/esphome/secrets.yaml (the add-on's own secrets file)
#   Building from this repo: firmware/stakes/secrets.yaml
# Every stake uses the same values.

# Wi-Fi the stakes join
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"

# Login for each stake's web page and /metrics. Put the same password in the
# Pi's esp_web_password file so Prometheus can scrape (see deploy/README.md).
web_username: "esp"
web_password: "pick-a-long-one"

# Encrypts the Home Assistant connection AND every firmware update over the
# network. Keep a copy somewhere safe: without it a stake can only be updated
# by USB. Generate one:
#   python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
api_key: "base64-32-byte-key-goes-here"

# Only the legacy 4-probe firmware uses these:
ota_password: "something"
fallback_password: "something-else"
